version = "1.0"

[metadata]
slug = "collinear-candidate/sbi-netbanking-redaction"
name = "SBI netbanking demo video redaction"
description = "Irreversibly obscure the branch names, branch codes and transfer reference number in a 2m13s netbanking screen-recording — across zooms, scrolls, caption-bar clipping and cursor occlusion — without touching pre-masked fields or any other UI, preserving audio and container properties."
authors = ["bhavishpahwa2@gmail.com"]
category = "video-processing"
tags = ["computer-vision", "privacy-redaction", "long-horizon", "verification-discipline"]
difficulty = "hard"

[agent]
# the oracle needs ~45 min; an agent exploring the video needs more
timeout_sec = 10800

[verifier]
# single lockstep decode pass over both videos plus probe matching
timeout_sec = 1800

[environment]
build = "environment/Dockerfile"
network = "none"
cpus = 4
memory_gb = 8
storage_gb = 4

[oracle]
entrypoint = "solution/solve.sh"
